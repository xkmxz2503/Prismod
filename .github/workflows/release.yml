name: Build and publish Minecraft mod

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build Prismod
    runs-on: windows-latest

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        shell: pwsh
        run: .\gradlew.bat build --no-daemon --stacktrace

      - name: Find release JAR
        id: artifact
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem -Path "build\libs" -Filter "prismod-*.jar" -File)
          if ($artifacts.Count -ne 1) {
            Write-Error "Expected exactly one Prismod release JAR, found $($artifacts.Count)"
            $artifacts | ForEach-Object { Write-Error $_.FullName }
            exit 1
          }

          $artifact = $artifacts[0].FullName
          "path=$artifact" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "Built artifact: $artifact"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: prismod-${{ github.event.release.tag_name }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

      - name: Upload JAR to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ARTIFACT_PATH: ${{ steps.artifact.outputs.path }}
        run: gh release upload $env:RELEASE_TAG $env:ARTIFACT_PATH --clobber --repo $env:GITHUB_REPOSITORY
